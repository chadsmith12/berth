# =============================================================================
# Berth generated — Laravel stack (production)
# One image, multiple roles: app + workers
# =============================================================================

x-app-image: &app-image
    build:
        context: .
        dockerfile: docker/app/Dockerfile
        target: runtime

x-app-env: &app-env
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY}
    APP_URL: ${APP_URL}

    DB_CONNECTION: pgsql
    DB_HOST: ${DB_HOST}
    DB_PORT: ${DB_PORT:-5432}
    DB_DATABASE: ${DB_DATABASE}
    DB_USERNAME: ${DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD}
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    SESSION_DRIVER: database

services:
    app:
        <<: *app-image
        environment:
            <<: *app-env
            CONTAINER_ROLE: app
            RUN_MIGRATIONS: "true"
            SERVER_NAME: ":8080"
        expose:
            - "8080"
        volumes:
            - app-storage:/app/storage/app
        healthcheck:
            test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 40s
        deploy:
            replicas: 1
        restart: unless-stopped
    worker-1:
        <<: *app-image
        command: >
            php artisan queue:work
              --queue=high,default,low
              --tries=3
              --max-time=3600
              --sleep=3
        environment:
            <<: *app-env
            CONTAINER_ROLE: worker
        volumes:
            - app-storage:/app/storage/app
        depends_on:
            app:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            disable: true
    worker-2:
        <<: *app-image
        command: >
            php artisan queue:work
              --queue=high,default,low
              --tries=3
              --max-time=3600
              --sleep=3
        environment:
            <<: *app-env
            CONTAINER_ROLE: worker
        volumes:
            - app-storage:/app/storage/app
        depends_on:
            app:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            disable: true

volumes:
    app-storage:
